# CodeArts Doer plugin configuration for CLIProxyAPI.
#
# Merge the `plugins:` block below into your CLIProxyAPI config.yaml. The plugin
# ID is the dynamic library file name without its extension, so the library must
# be named `codearts-provider.dll` / `codearts-provider.so` / `codearts-provider.dylib`.
#
# Placement (searched in priority order per platform):
#   plugins/<GOOS>/<GOARCH>/codearts-provider.dll   <- most specific, used below
#   plugins/<GOOS>/<GOARCH>-<variant>/codearts-provider.dll
#   plugins/codearts-provider.dll
#
# CLIProxyAPI must be a CGO build ("1" is reported by the management API header
# indicating dynamic-library plugin support).

plugins:
  # Global switch. File discovery and per-plugin config are ignored when this is
  # false.
  enabled: true
  dir: "plugins"
  configs:
    codearts-provider:
      # Per-plugin switch. Omitting it is treated as enabled.
      enabled: true
      # Start/register/routing order: higher priority runs first.
      priority: 100

      # ---------------------------------------------------------------------
      # Upstream endpoint
      # ---------------------------------------------------------------------

      # CodeArts Doer regional API gateway. Both the native chat API and the
      # OpenAI-compatible agent API are served from this host.
      # The 26.9.x client ships only two regions: cn-north-4 (Beijing) and
      # ap-southeast-1 (Singapore). The gateway host must match the region that
      # issued the login token, otherwise every call comes back as an
      # unregistered model.
      base_url: "https://snap-access.cn-north-4.myhuaweicloud.com"

      # 限时福利 (free tier) gateway. It serves the daily-claimable catalogue and
      # its own model list; those models are absent from every agent catalogue and
      # are reached on chat by signing an extra `maas_type: benefit` header, which
      # the plugin adds automatically for anything this list returns.
      # Set it to an empty string to stop advertising benefit models.
      benefit_base_url: "https://opengw.developer.huaweicloud.com"

      # Upstream protocol.
      #   agent  - OpenAI-compatible POST /api/v2/chat/completions
      #   native - proprietary POST /v1/chat/chat with CodeArts SSE framing
      #
      # native is text-only: requests carrying tools, tool_choice, functions,
      # function_call, tool-role messages or non-text content parts are rejected
      # with HTTP 400 rather than silently dropped. Use agent for tool use,
      # images and Claude Code.
      api_mode: "agent"

      # CodeArts web console used to start the browser sign-in flow.
      web_login_base: "https://codearts.huaweicloud.com"

      # Huawei STS OAuth endpoints. Public-cloud users should keep these values;
      # overrides mainly exist for private clouds and integration tests.
      oauth_token_url: "https://sts.cn-north-4.myhuaweicloud.com/v1/oauth2/tokens"
      oauth_identity_url: "https://sts.cn-north-4.myhuaweicloud.com/v5/caller-identity"

      # ---------------------------------------------------------------------
      # Client identity sent upstream (these headers are part of the signature)
      # ---------------------------------------------------------------------

      plugin_name: "snap_vscode"
      plugin_version: "26.9.101"
      # Defaults to "Vscode_<plugin_version>" when omitted.
      client_version: "Vscode_26.9.101"
      language: "en-us"

      # ---------------------------------------------------------------------
      # Models
      # ---------------------------------------------------------------------

      # Upstream agent to talk to. Used by the native protocol only.
      agent_id: "Pangu_Doer_in_CodeArts"

      # Upstream model_id used when the requested model has no explicit mapping.
      default_model_id: "GLM-5.2"

      # Client-facing ID -> upstream model_id. Add an entry per model you want to
      # expose under a friendlier alias.
      model_map:
        "glm": "GLM-5.2"

      # Models advertised to CLIProxyAPI when discovery is off, and the fallback
      # list when it fails. Use the IDs the account actually owns: an ID the
      # gateway does not recognise is answered
      # `InferHub.002002009.404 The model is not registered`.
      models:
        - id: "GLM-5.2"
          name: "GLM-5.2"
          display_name: "GLM-5.2 (CodeArts)"
          description: "CodeArts Doer chat model."
          context_length: 202752
          max_output_tokens: 131072
        # `benefit: true` marks a 限时福利 model, so its chat requests carry the
        # signed maas_type: benefit header. Discovery tags these automatically;
        # the flag is only needed when listing them by hand.
        - id: "deepseek-v4-pro-0813"
          name: "deepseek-v4-pro-0813"
          display_name: "DeepSeek-V4-Pro (CodeArts 限时福利)"
          context_length: 1048576
          max_output_tokens: 393216
          benefit: true

      # Ask the upstream for this account's model list on model.for_auth instead
      # of advertising the static list above. Three catalogues are merged, in
      # order: the built-in list (`GET /v1/model/builtin`, the endpoint the IDE's
      # own model picker reads), the 限时福利 list from `benefit_base_url`, and —
      # only when both come back empty — the agent-centre detail query below.
      # Results are cached per account for 5 minutes; any total failure falls back
      # to `models`.
      discover_models: true

      # Agent IDs used by the agent-centre fallback. Empty uses the extension's
      # own Act and Plan agents. Set these when your tenant attaches models to
      # different agents; the built-in catalogue normally makes this unnecessary.
      model_agent_ids: []

      # ---------------------------------------------------------------------
      # Transport / signing
      # ---------------------------------------------------------------------

      # Ask the upstream for SSE heartbeat comment frames.
      heartbeat: true

      # Include `host` in the signature's SignedHeaders list. Off by default
      # because the official extension does not sign `host`; turn it on only if
      # your gateway rejects the default.
      sign_host: false

      # Set the is_confidential header (KIA / confidential-code mode).
      is_confidential: false

      request_timeout_seconds: 600
      login_timeout_seconds: 300

      # ---------------------------------------------------------------------
      # OAuth PKCE browser authorization callback
      # ---------------------------------------------------------------------
      #
      # The plugin opens a localhost listener and hands its URL to CodeArts,
      # exactly like VS Code CodeArts Agent 26.9.101. After authorization it
      # exchanges the one-time code with PKCE + DPoP and stores the refresh
      # context in CPA.

      # Keep these defaults for Docker or a remote server. The browser will end
      # on an unreachable localhost URL; copy that full URL into the plugin
      # panel. No public callback, reverse proxy, or Docker port is needed.
      login_callback_bind: "127.0.0.1"
      login_callback_port: 0
      login_callback_base: ""

      # Advanced local-LAN deployments may pin a port and advertise a directly
      # reachable HTTP base, but do not expose this callback publicly.

      # ---------------------------------------------------------------------
      # Scheduled tasks
      # ---------------------------------------------------------------------
      #
      # The CLIProxyAPI plugin ABI has no timer: the host never calls a plugin on
      # a schedule, so the plugin runs its own cron. Expressions accept the
      # standard 5-field form (minute first) or the 6-field form with seconds.
      schedule:
        enabled: true
        # IANA zone the expressions are evaluated in. Empty means the host's
        # local zone.
        timezone: "Asia/Shanghai"

        # When tasks is omitted the built-in defaults below are used. Set
        # disable_defaults: true to run only your own tasks.
        disable_defaults: false

        tasks:
          # Renew the temporary AK/SK hourly. The upstream credential lasts 24h
          # and the official IDE extension renews every hour.
          - id: "token-renew"
            type: "token_renew"
            cron: "17 * * * *"
            enabled: true

          # Keep the subscription/quota snapshot warm for the panel and the
          # quota API, so a page load does not hit the upstream per account.
          - id: "quota-refresh"
            type: "quota_refresh"
            cron: "*/30 * * * *"
            enabled: true

          # Daily benefit check-in (每日签到). The claim UI is a server-hosted
          # page ("Wish Wall") and the extension performs no claim request, so
          # there is no endpoint to hard-code. Capture the real request once
          # (browser devtools -> Network -> copy as cURL while claiming), then
          # fill in the fields below. Disabled until you do.
          - id: "daily-checkin"
            type: "checkin"
            cron: "5 0 * * *"                          # 00:05 daily
            checkin_method: "POST"
            # Absolute, or a path resolved against base_url. The 限时福利 claim
            # lives on the open gateway and takes an empty body; it is idempotent,
            # so running it twice a day is harmless.
            checkin_url: "https://opengw.developer.huaweicloud.com/api/v1/benefit/claim"
            checkin_body: ""
            checkin_headers: {}
              # x-snap-traceid: "..."   # only if the page sends one
            # Text that appears only on a real claim. With this set, a bare HTTP
            # 200 that lacks the marker is reported as a failure rather than a
            # silent success.
            checkin_success_marker: '"error_msg":"success"'
            # Text meaning "already claimed today". Matching it counts as
            # success, so a twice-a-day schedule does not look like a failure.
            checkin_already_marker: ""
            # The allowance is granted per Huawei Cloud account, so a deployment
            # with several credentials has to claim for each of them. Off by
            # default: an unknown claim URL is not necessarily per-account, and
            # repeating it for every credential is the pattern upstream throttles.
            checkin_all_accounts: true
            # Or pin one account by auth index, file name or label. Empty means
            # "not restricted".
            checkin_auth_index: ""
            enabled: false

          # Escape hatch: schedule any CodeArts gateway endpoint. `path` is
          # resolved against base_url. Set sign: true to sign the request with
          # the first available credential.
          - id: "custom-instructions-warmup"
            type: "http"
            cron: "0 8 * * 1-5"     # weekdays at 08:00
            method: "GET"
            path: "/v1/chat/custom-instructions"
            sign: true
            enabled: false

      # Extra headers added to every upstream request. They are included in the
      # request signature, so keep the set stable.
      extra_headers: {}
        # x-snap-zone: "green"
        # department: "your-department"

      # Debugging only: send unsigned upstream requests when no credential is
      # available. Never enable this in production.
      insist_missing_credentials: false
